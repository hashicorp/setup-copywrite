version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # Ignore eslint major version updates (keep at v8.x for compatibility with eslint-config-standard)
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # Ignore eslint-plugin-promise major version updates (keep at v6.x for compatibility with eslint-config-standard)
      - dependency-name: "eslint-plugin-promise"
        update-types: ["version-update:semver-major"]
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    groups:
      actions:
        patterns:
          - "@actions/*"
      octokit:
        patterns:
          - "@octokit/*"
      linting:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
      build-and-test:
        patterns:
          - "esbuild"
          - "vitest"
          - "@vitest/*"
          - "nock"
